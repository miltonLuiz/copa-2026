      /* ===== reset mínimo ===== */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        background-color: var(--bg);
        background-image:

        color: var(--text);
        font-family: 'Manrope', sans-serif;
        min-height: 100vh;
      }

      /* ===== container ===== */
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px;
      }

      @media (min-width: 720px) {
        .container {
          padding: 24px;
        }
      }

      /* ===== header ===== */
      header {
        margin-block-end: 32px;
      }

      header h1 {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 36px;
        letter-spacing: 0.02em;
        color: var(--text);
        line-height: 1.1;
      }

      header p {
        font-family: 'Manrope', sans-serif;
        font-size: 14px;
        font-weight: 400;
        color: var(--muted);
        margin-top: 4px;
      }

      @media (min-width: 720px) {
        header h1 {
          font-size: 48px;
        }

        header p {
          font-size: 16px;
        }
      }

      /* ===== countdown ===== */
      #countdown {
        margin-block-end: 32px;
      }

      /* ===== stats ===== */
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        margin-block-end: 40px;
      }

      .stats__item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .stats__value {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 40px;
        color: var(--accent);
        line-height: 1;
      }

      .stats__label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
