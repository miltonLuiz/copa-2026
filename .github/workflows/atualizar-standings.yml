name: Atualizar classificação dos grupos

on:
  # Rede de segurança: o schedule do GitHub é "melhor esforço" e descarta a
  # maioria dos ticks curtos, então a atualização de ~5 min de verdade vem do
  # repository_dispatch disparado por um cron externo (ex: cron-job.org).
  schedule:
    - cron: '*/30 * * * *'
  # Disparo externo a cada ~5 min. event_name != workflow_dispatch, então
  # FORCAR_EXECUCAO fica '0' e a guarda de janela continua valendo (só chama a
  # API durante os jogos).
  repository_dispatch:
    types: [atualizar]
  # Manual (debug): força a execução ignorando a guarda de janela.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-standings
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Buscar standings e jogos da API
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FORCAR_EXECUCAO: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/fetch-standings.js
      - name: Commitar se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings.json data/matches.json
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados dos jogos."
          else
            git commit -m "chore: atualizar dados dos jogos e classificação"
            git push
          fi
