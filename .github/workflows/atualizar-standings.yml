name: Atualizar classificação dos grupos

on:
  schedule:
    # A cada 5 min. A guarda de janela em fetch-standings.js só chama a API
    # durante os jogos (15 min antes do início até 4h depois, ou jogo IN_PLAY/PAUSED);
    # fora da janela a execução sai cedo sem gastar requests.
    # Cada execução faz 2 chamadas (/matches + /standings) — bem abaixo do limite
    # de 10 req/min do plano free, mesmo no pico.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-standings
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Buscar standings e jogos da API
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FORCAR_EXECUCAO: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/fetch-standings.js
      - name: Commitar se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings.json data/matches.json
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados dos jogos."
          else
            git commit -m "chore: atualizar dados dos jogos e classificação"
            git push
          fi
